name: Build Windows binary

on:
  workflow_dispatch:            # manual "run now" — perfect for a quick exe test
  push:
    tags: ['v*']                # every release tag builds the exe

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build CLI exe
        run: python build_project.py cli
      - name: Build GUI exe (Streamlit)
        run: python build_project.py gui
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          foreach ($name in 'mhub', 'mhub-gui') {
            $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name.exe" | Out-File -Encoding ASCII "dist/$name.exe.sha256"
          }
      # conf/ is development-only. The production exes ship alone: without a
      # conf/config.yaml they default the database to <exe>/data and create a
      # default conf/log.yaml + <exe>/logs on first run.
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mhub-windows
          path: |
            dist/mhub.exe
            dist/mhub.exe.sha256
            dist/mhub-gui.exe
            dist/mhub-gui.exe.sha256
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mhub.exe
            dist/mhub.exe.sha256
            dist/mhub-gui.exe
            dist/mhub-gui.exe.sha256

