name: Build Windows binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the exes

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read the version
        shell: pwsh
        run: |
          $version = python -c "import version; print(version.VERSION_STRING)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build CLI exe
        run: python build_project.py cli
      - name: Build GUI exe (folder layout)
        run: python build_project.py gui --layout onedir
      - name: Package the GUI folder
        shell: pwsh
        run: |
          # -Path <folder> stores the folder itself as the archive root, so
          # extracting the zip produces a clean mhub-gui/ directory.
          Compress-Archive -Path dist/mhub-gui `
            -DestinationPath "dist/mhub-gui-$env:VERSION-windows.zip" -Force
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          foreach ($name in 'mhub.exe', "mhub-gui-$env:VERSION-windows.zip") {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ASCII "dist/$name.sha256"
          }
      # conf/ is development-only. The production artefacts ship alone: the CLI
      # exe defaults the database to <exe>/data and creates a default
      # conf/log.yaml + <exe>/logs on first run, and the GUI folder does the same
      # inside its own directory.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mhub-windows
          path: |
            dist/mhub.exe
            dist/mhub.exe.sha256
            dist/mhub-gui-${{ env.VERSION }}-windows.zip
            dist/mhub-gui-${{ env.VERSION }}-windows.zip.sha256
          # The exe and the zip are already compressed, so re-compressing them
          # only costs CPU. This is the internal workflow artifact; the release
          # assets users download are unaffected.
          compression-level: 0
      # The release body is the matching section of CHANGELOG.md. The script exits
      # non-zero when the tag, version.py and the changelog disagree, so a
      # mis-tagged build cannot publish the wrong notes.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python utils/release_notes.py --tag "${{ github.ref_name }}" --output dist/release_notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          files: |
            dist/mhub.exe
            dist/mhub.exe.sha256
            dist/mhub-gui-${{ env.VERSION }}-windows.zip
            dist/mhub-gui-${{ env.VERSION }}-windows.zip.sha256

