name: Build Windows binary

on:
  workflow_dispatch:            # manual "run now" — perfect for a quick exe test
  push:
    tags: ['v*']                # every release tag builds the exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exe
        run: python build_project.py
      # conf/ is development-only. The production exe ships alone: without a
      # conf/config.yaml it defaults its database to <exe>/data and creates a
      # default conf/log.yaml + <exe>/logs on first run.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mhub-windows
          path: dist/mhub.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mhub.exe

