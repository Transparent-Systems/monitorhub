name: Build Linux binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the binaries

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build CLI binary
        run: python build_project.py cli
      - name: Build GUI binary (Streamlit)
        run: python build_project.py gui
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum mhub > mhub.sha256
          sha256sum mhub-gui > mhub-gui.sha256
      # conf/ is development-only. The production binaries ship alone: without a
      # conf/config.yaml they default the database to <binary>/data and create a
      # default conf/log.yaml + <binary>/logs on first run.
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mhub-linux
          path: |
            dist/mhub
            dist/mhub.sha256
            dist/mhub-gui
            dist/mhub-gui.sha256
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mhub
            dist/mhub.sha256
            dist/mhub-gui
            dist/mhub-gui.sha256