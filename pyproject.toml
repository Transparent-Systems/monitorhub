[project]
name = "monitorhub"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "watchdog",
    "PyYAML",
    "python-dotenv",
    "boto3",
    "boto3-stubs[s3]",
    "pyinstaller",
    "ruff",
]

# Separate development tools (like pytest) into optional dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "pip-tools",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Automatically pass -s (show stdout/print calls)
addopts = "-s"
# Optionally tell pytest to collect files named *_stress_test.py
python_files = ["test_*.py", "*_test.py"]

# Lint rulesets consolidated here (the per-directory app/*/ruff.toml files were
# removed). "I" (isort) and "BLE" (blind-except) are explicit so the quality bar
# does not silently depend on ruff's version-specific default rule set.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]
# Carried over from the removed per-directory ruff.toml files.
extend-ignore = ["E402", "SIM102"]